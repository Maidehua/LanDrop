name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64
        run: dotnet publish windows/LanDrop.Windows/LanDrop.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: LanDrop-Windows-x64
          path: dist/windows/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LanDrop-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
